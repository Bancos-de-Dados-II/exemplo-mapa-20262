<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        #map {
            height: 400px;
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <select id="select-municipio"></select>
    </div>
    <div id="map"></div>

    <script>

        var map = L.map('map').setView([-6.8864, -38.5575], 14);
        let jsonLayer;
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const select = document.getElementById('select-municipio');

        fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/25/municipios')
            .then(response => response.json())
            .then(data => {
                data.forEach(municipio => {
                    const option = document.createElement('option');
                    option.value = municipio.id;
                    option.textContent = municipio.nome;
                    select.appendChild(option);
                });
            });

            select.addEventListener('change', ()=>{
                fetch(`https://exemplo-mapa-20262.onrender.com/municipios/${select.value}`)
                    .then(response => response.json())
                    .then(data =>{
                        let jsonData = JSON.parse(data.st_asgeojson);
                        if(jsonLayer){
                            map.removeLayer(jsonLayer);
                        }
                        jsonLayer = L.geoJSON(jsonData).addTo(map);
                        map.fitBounds(jsonLayer.getBounds());
                    });
            });

    </script>

</body>

</html>
